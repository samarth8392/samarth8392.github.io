name: Update Citation Count

on:
  schedule:
    # Runs at 12:00 UTC on days 1,4,7,...,31 of every month (~every 3 days).
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-citations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch citation count from Google Scholar and update index.md
        run: python3 scripts/update_citations.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- index.md; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.md
          git commit -m "chore: update citation count from Google Scholar"
          git push
