name: Update Publication Data

on:
  schedule:
    # Runs at 12:00 UTC on days 1,4,7,...,31 of every month (~every 3 days).
    - cron: '0 12 */3 * *'
  push:
    branches: ["master"]
    paths: ["_data/pub_list.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Fetch publication data from Crossref and OpenAlex
        run: python3 scripts/update_publications.py

      - name: Commit, push and redeploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- _data/publications.json _data/metrics.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/publications.json _data/metrics.json
          git commit -m "chore: update publication data from Crossref/OpenAlex"
          git push
          # Pushes made with GITHUB_TOKEN don't trigger other workflows, so
          # start the Pages deploy explicitly.
          gh workflow run jekyll.yml --ref master
